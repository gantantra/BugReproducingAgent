<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Investigator</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161922;
        --panel-2: #1c2029;
        --line: #272c38;
        --text: #e6e8ee;
        --muted: #9099ad;
        --accent: #6ea8fe;
        --ok: #5cc98c;
        --warn: #e0b252;
        --bad: #e57373;
        --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;

        /* One column, one left rail. Every message indents its body past a right-aligned speaker
           label, so the composer and the loader have to sit on the same gutter or nothing below
           the transcript lines up with anything in it. Derived rather than repeated, so moving
           the label width cannot leave the footer behind. */
        --label: 54px;
        --label-gap: 10px;
        --gutter: calc(var(--label) + var(--label-gap));
        --column: 860px;
      }
      * {
        box-sizing: border-box;
      }

      /* No scrollbar chrome anywhere. Scrolling still works — wheel, trackpad, keys, touch — it
         just is not drawn. A scrollbar gutter appearing and disappearing as content grows shifts
         the layout by its own width, which is what made cards look misaligned against each other
         while a run streamed. */
      * {
        scrollbar-width: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.55 ui-sans-serif,
          system-ui,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      header .ws {
        font: 11px/1.4 var(--mono);
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 46vw;
      }
      header .spacer {
        flex: 1;
      }
      .pill {
        font: 11px/1 var(--mono);
        padding: 5px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.ok {
        color: var(--ok);
        border-color: #2f6b4c;
      }
      .pill.bad {
        color: var(--bad);
        border-color: #6b3232;
      }

      /* The pipeline, shown only while something is actually being waited on. */
      .waiting {
        margin: 0 0 10px;
        padding: 10px 12px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .waiting .now {
        display: flex;
        align-items: center;
        gap: 9px;
        font: 12px/1.4 var(--mono);
        color: var(--text);
        margin-bottom: 9px;
      }
      .waiting .elapsed {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
      }
      /* Wraps rather than scrolling sideways. A horizontal scroll region in a header is the one
         scrollbar a reader never expects, and the steps are short enough to sit on one line at
         any sane width anyway. */
      .rail {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .rail .step {
        font: 11px/1 var(--mono);
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .rail .step.active {
        color: var(--accent);
        border-color: #2f4f7a;
        background: #16203010;
      }
      .rail .step.done {
        color: var(--ok);
        border-color: #2f6b4c;
      }

      main {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 20px 16px 8px;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .msg {
        display: flex;
        gap: var(--label-gap);
      }
      .msg .who {
        font: 10px/1.8 var(--mono);
        color: var(--muted);
        width: var(--label);
        flex: 0 0 var(--label);
        text-align: right;
        text-transform: uppercase;
      }
      .msg .body {
        flex: 1;
        min-width: 0;
      }
      .msg.user .body {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        white-space: pre-wrap;
      }
      .msg.agent .body > p:first-child {
        margin-top: 0;
      }
      .msg .body > p:last-child {
        margin-bottom: 0;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .card h3 {
        margin: 0;
        padding: 10px 13px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
      }
      .card .inner {
        padding: 12px 13px;
      }
      /* A restored transcript replays titles and key/value rows but not buttons, so a card whose
         content was only buttons came back as a title above an empty padded strip. Collapse it
         rather than render a box with nothing in it. */
      .card .inner:empty {
        display: none;
      }
      .card.bad {
        border-color: #6b3232;
      }
      .card.bad h3 {
        color: var(--bad);
      }

      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 14px;
        margin: 0;
      }
      dl.kv dt {
        color: var(--muted);
        font: 11px/1.7 var(--mono);
      }
      dl.kv dd {
        margin: 0;
        font: 12px/1.7 var(--mono);
        word-break: break-word;
      }

      ol.steps,
      ul.plain {
        margin: 6px 0 0;
        padding-left: 20px;
      }
      ol.steps li,
      ul.plain li {
        margin: 4px 0;
      }
      code,
      .mono {
        font-family: var(--mono);
        font-size: 12px;
      }
      .quote {
        border-left: 2px solid var(--line);
        padding-left: 10px;
        color: var(--muted);
        margin: 6px 0;
      }

      /* No inner scroll region. The block sizes to its content and the page scrolls, so a card
         never carries a second scrollbar inside the one the page already has. The line count is
         capped in app.js instead, which bounds the height without clipping anything silently. */
      .log {
        font: 11.5px/1.55 var(--mono);
        background: #0b0d11;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #c3cad8;
      }

      /* The plan the operator reads before a browser opens. Same no-inner-scroll rule as .log:
         it sizes to its content and the page scrolls, never the card. Slightly larger than the
         log because this one is meant to be read carefully rather than glanced at. */
      .plan {
        font: 12.5px/1.65 var(--mono);
        background: #0b0d11;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 10px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: #d6dcea;
      }

      /* The one thing in a plan card that needs answering, rather than reading. */
      .ask {
        margin-top: 12px;
        padding-left: 10px;
        border-left: 2px solid var(--accent);
        color: var(--text);
      }

      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 11px;
      }
      button {
        font: 12px/1 inherit;
        font-family: inherit;
        padding: 8px 13px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #3c4256;
        background: #222736;
      }
      button.primary {
        background: #1d3357;
        border-color: #2f4f7a;
        color: #cfe0ff;
      }
      button.danger {
        background: #3a2020;
        border-color: #6b3232;
        color: #ffd9d9;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      input[type="number"],
      input[type="text"] {
        font: 12px var(--mono);
        background: #0b0d11;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 6px;
        padding: 7px 9px;
      }

      video {
        width: 100%;
        border-radius: 8px;
        background: #000;
        margin-top: 8px;
      }

      table.runs {
        width: 100%;
        border-collapse: collapse;
        font: 12px var(--mono);
        margin-top: 6px;
      }
      table.runs th,
      table.runs td {
        text-align: left;
        padding: 5px 8px;
        border-bottom: 1px solid var(--line);
      }
      table.runs th {
        color: var(--muted);
        font-weight: 500;
      }

      /* Live Viewport shown during browser authoring */
      /* Pinned to the top of the transcript while its session runs; the steps below scroll up
         behind it. Unpinned (.ended) when the job finishes. */
      .live-viewport {
        position: sticky;
        /* Sticky offsets start inside main's padding-top (20px); without cancelling it, steps
           scrolling up showed through the gap above the viewport. */
        top: -20px;
        z-index: 2;
        margin: 10px 0 12px;
        background: #090a0d;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 14px 18px -14px #000;
      }
      .live-viewport.ended {
        position: static;
        box-shadow: none;
      }
      /* clip keeps the rounded corners without making the card a scroll container, which would pin
         the viewport inside the card instead of to the transcript. */
      .card.live {
        overflow: clip;
      }
      .live-viewport-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: var(--panel-2);
        border-bottom: 1px solid var(--line);
        font: 11px/1.4 var(--mono);
      }
      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .live-dot {
        width: 7px;
        height: 7px;
        background: var(--ok);
        border-radius: 50%;
        box-shadow: 0 0 6px var(--ok);
        animation: live-pulse 2s infinite;
      }
      @keyframes live-pulse {
        0% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
        100% { opacity: 1; transform: scale(1); }
      }
      .live-status {
        color: var(--muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 65%;
      }
      /* The pinned block holds the browser AND the latest steps, sized to the room the transcript
         actually has. The steps used to be a separate log below the viewport and scrolled up behind
         it: with the busy bar showing, a 1280x720 laptop had room for ONE line of them. Heights
         subtract the page header, the busy footer and the viewport's own header from the window,
         so the whole block, steps included, fits on screen while it is pinned. */
      .live-viewport-body {
        display: flex;
        flex-direction: column;
      }
      .live-viewport-frame {
        position: relative;
        height: max(120px, min(360px, calc(100vh - 430px)));
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .live-viewport-frame img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .live-log {
        height: 140px;
        overflow-y: auto;
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0;
      }
      /* A phone-shaped page — a mobile run — leaves most of the width empty beside it, so the steps
         go there, as tall as the frame, instead of in a strip below. */
      .live-viewport.portrait .live-viewport-body {
        flex-direction: row;
        height: max(200px, min(480px, calc(100vh - 290px)));
      }
      .live-viewport.portrait .live-viewport-frame {
        height: 100%;
        flex: 0 0 auto;
      }
      .live-viewport.portrait .live-viewport-frame img {
        width: auto;
      }
      .live-viewport.portrait .live-log {
        height: auto;
        flex: 1 1 auto;
        min-width: 0;
        border-top: 0;
        border-left: 1px solid var(--line);
      }
      .live-placeholder {
        color: var(--muted);
        font: 12px var(--mono);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 30px;
      }

      footer {
        flex: 0 0 auto;
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 10px 16px 14px;
      }
      /* The footer's own column, matching the transcript's: same width, same left gutter, so the
         composer's left edge continues the line every card above it sits on. */
      .footwrap {
        max-width: var(--column);
        margin: 0 auto;
        padding-left: var(--gutter);
      }
      .composer {
        display: flex;
        gap: 9px;
        align-items: flex-end;
      }
      textarea {
        flex: 1;
        resize: vertical;
        min-height: 46px;
        max-height: 220px;
        font: 13px/1.5 inherit;
        background: #0b0d11;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 11px 12px;
      }
      textarea:focus,
      input:focus {
        outline: 1px solid #2f4f7a;
      }
      .hint {
        margin: 7px 0 0;
        font: 11px var(--mono);
        color: var(--muted);
      }
      /* The session's variables, beside the conversation rather than inside it.
         They are a list you edit — add one, delete one, check what is held — and a card pushed
         into the transcript freezes that list at one moment, then scrolls away while the real one
         changes underneath it. Opening the panel costs the conversation nothing. */
      .side-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(420px, 92vw);
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -18px 0 40px -24px #000;
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      /* `display: flex` above outranks the browser's own `[hidden] { display: none }`, so without
         this the panel opens and never closes: the close button sets `hidden` and nothing happens. */
      .side-panel[hidden] {
        display: none;
      }
      /* With the panel open the conversation moves out from under it rather than being covered.
         The composer sits at the bottom of the page, and a drawer laid over it hides the one
         control you need while you are reading what is in the drawer. Narrow screens keep the
         overlay, because there is nowhere to shift to. */
      @media (min-width: 900px) {
        body.panel-open main,
        body.panel-open footer {
          padding-right: 436px;
        }
      }
      .side-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        background: var(--panel-2);
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
      }
      .side-panel-title {
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .side-panel-close {
        padding: 4px 9px;
        font: 12px/1 var(--mono);
      }
      .side-panel-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px 14px;
      }
      .var-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 9px;
        margin-bottom: 5px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .var-name {
        font: 12px var(--mono);
        color: var(--accent);
      }
      .var-desc {
        color: var(--muted);
        font-size: 11px;
      }
      .var-value {
        font: 12px var(--mono);
        color: var(--muted);
        margin-right: 10px;
      }
      .var-add {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .var-add input {
        font: 12px var(--mono);
        background: #0b0d11;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        padding: 7px 9px;
      }
      /* Said here rather than in the conversation: this is where the change happened. */
      .side-panel-status {
        min-height: 16px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }

      .spin {
        display: inline-block;
        width: 9px;
        height: 9px;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: s 0.8s linear infinite;
        vertical-align: -1px;
      }
      @keyframes s {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body data-token="__TOKEN__" data-workspace="__WORKSPACE__">
    <header>
      <h1>Investigator</h1>
      <span class="ws" id="ws"></span>
      <span class="spacer"></span>
      <button class="pill" id="varsBtn" style="cursor:pointer;background:none;" title="View and manage session variables">variables (0)</button>
      <span class="pill" id="provider">checking…</span>
      <span class="pill" id="inv">no investigation</span>
    </header>

    <main><div class="wrap" id="transcript"></div></main>

    <aside class="side-panel" id="varsPanel" hidden aria-label="Session variables">
      <div class="side-panel-head">
        <span class="side-panel-title">Session variables</span>
        <button class="side-panel-close" id="varsPanelClose" title="Close (Esc)">✕</button>
      </div>
      <div class="side-panel-body" id="varsPanelBody"></div>
    </aside>

    <footer>
      <div class="footwrap">
        <div class="waiting" id="waiting" hidden>
          <div class="now">
            <span class="spin"></span>
            <span id="waitingLabel">Working…</span>
            <span class="elapsed" id="waitingElapsed"></span>
          </div>
          <div class="rail" id="rail"></div>
        </div>

        <div class="composer">
          <textarea
            id="input"
            placeholder="Describe the bug — the URL, the steps, what you expected, what happens instead, and how often."
          ></textarea>
        </div>
        <div class="hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
