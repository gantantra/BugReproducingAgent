# propose_experiments — rank candidate experiments for a human to approve at gate 1.
#
# Tool-using: the model must read the flow, the target's constraints, and what previous
# experiments already measured, rather than proposing from imagination.
id: propose_experiments
# 1.1.0: the tool loop actually runs now, so the budget has to cover a history that carries tool
# results. It was sized when no tool call ever reached the provider.
# 1.2.0: maxOutputTokens raised for a THINKING model. See the budget note below.
version: 1.2.0
modelAlias: REASONING_MODEL
temperature: 0
tools:
  - get_flow
  - get_application_constraints
  - get_previous_experiment_summary
inputSchema: schemas/intake.output.v1.json
outputSchema: schemas/propose-experiments.output.v1.json
partialCapable: true
unitField: items
budget:
  maxTurns: 6
  maxToolCalls: 6
  maxEvidenceBytes: 65536
  # Measured, not guessed: with the tool loop working, a run that reads the flow and the target's
  # constraints refused before dispatch at a worst case of 29372 against the old 26000 ceiling
  # (20000 input + 6000 output). Each tool reply is ~3KB of JSON and up to six are allowed, so the
  # input side is raised to hold a full history rather than to make one observed run fit.
  maxInputTokens: 40000
  # This alias runs in thinking mode, and DeepSeek bills reasoning tokens against the same
  # completion budget as the answer. Measured on a live run: the turn that produced a valid answer
  # spent 3017 of its 3037 completion tokens on reasoning, and the repair turn that followed spent
  # all 6000 on reasoning and returned an EMPTY content field -- which surfaced as "response is not
  # parseable JSON", a message that says nothing about the actual cause. Sized to leave the answer
  # room after the model has finished thinking, not to fit one observed run.
  maxOutputTokens: 16000
  maxCostUsd: 0.25
  maxWallClockMs: 120000
validation:
  schemaStrict: true
  rejectUnknownFields: true
  referenceCheck: true
  repairAttempts: 1
