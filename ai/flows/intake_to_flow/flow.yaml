# intake_to_flow — turn a human's bug report into a structured Flow.
#
# Single-shot and tool-free by design. The report is the only input, and inventing anything the
# reporter did not say is the failure mode this flow exists to avoid.
id: intake_to_flow
# 1.1.0: the prompt now states how to express a URL the reporter never gave (`url: null` plus an
# `unknownRef`). A real report omitted the path, the model dropped the key rather than emitting
# null, and every interpretation of that report failed validation.
version: 1.1.0
modelAlias: FAST_MODEL
temperature: 0
tools: []
inputSchema: schemas/intake.input.v1.json
outputSchema: schemas/intake.output.v1.json
budget:
  maxTurns: 3
  maxToolCalls: 0
  maxEvidenceBytes: 0
  # Sized WITH the few-shot examples in the prompt. They are ~3.5KB of JSON and teach the exact
  # output envelope, which is the difference between this flow working and every call failing
  # validation. 6000 was set when they were loaded but never sent.
  maxInputTokens: 22000
  maxOutputTokens: 7000
  maxCostUsd: 0.05
  maxWallClockMs: 60000
validation:
  schemaStrict: true
  rejectUnknownFields: true
  referenceCheck: false
  repairAttempts: 1
