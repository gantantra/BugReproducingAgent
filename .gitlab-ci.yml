# ReproAgent — AUTHORITATIVE CI (docs/m0-decisions.md, decision 5).
#
# This file is the gate. `.github/workflows/gate.yml` is retained for reference only and is
# marked non-authoritative in its own header; nothing reads it.
#
# Governing principle: Playwright produces evidence. Deterministic software normalizes and
# measures evidence. DeepSeek interprets and prioritizes evidence. Humans authorize consequential
# transitions.
#
# Secret safety, deliberately designed in rather than assumed:
#   - No job declares a DeepSeek variable. Every stage here is deterministic and must pass with
#     AI configuration absent (decision 6). If a stage ever needs a credential, it gets its own
#     job with a masked, protected CI variable -- never a cache and never an artifact.
#   - The cache covers ONLY npm's content-addressed download cache and the Playwright browser
#     download. Neither can contain a secret, and `.investigator/` (workspaces, evidence,
#     databases) is never cached or uploaded.
#   - Test diagnostics are uploaded as artifacts because they are already redacted before
#     persistence (ADR-0008). Raw evidence is not uploaded.

stages:
  - verify
  - gate

variables:
  # Keep npm's cache inside the project so GitLab can cache it; nothing secret lives here.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright"
  NODE_OPTIONS: ""
  GIT_DEPTH: "20"

default:
  image: node:24-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .playwright/
    policy: pull-push
  before_script:
    # `npm ci` is deliberate: the lockfile is the contract, and a CI run must not silently
    # resolve a different dependency tree than the one that was verified locally.
    - npm ci --no-audit --no-fund

# ---------------------------------------------------------------------------------------------
# Stage 1: everything that does not need a browser. Fast, and fails first.
# ---------------------------------------------------------------------------------------------

build:
  stage: verify
  timeout: 15m
  script:
    - npm run build
  artifacts:
    # Passed to later jobs so the CLI e2e suite tests the BUILT binary, not a re-transpile.
    expire_in: 1 day
    paths:
      - "packages/*/dist/"
      - "apps/cli/dist/"

lint:
  stage: verify
  timeout: 10m
  needs: ["build"]
  script:
    - npm run lint

format:
  stage: verify
  timeout: 10m
  script:
    # Formatting is enforced, not suggested (decision 9). It must never rewrite the frozen
    # Prompt A bytes -- `.prettierignore` excludes them and the checksum job below proves it.
    - npm run format:check

typecheck:
  stage: verify
  timeout: 15m
  script:
    - npm run typecheck

frozen-prompt-a:
  stage: verify
  timeout: 5m
  cache: []
  before_script: []
  script:
    # The frozen brief must be byte-identical to what was signed off. `.gitattributes` marks it
    # `-text` so no checkout rewrites its line endings; this job proves that held.
    - cd docs && sha256sum -c prompt-a.sha256

docs-invariants:
  stage: verify
  timeout: 10m
  needs: ["build"]
  script:
    # Governing-principle presence, schema validity, import-boundary graph, fixture experiments.
    - npm run test:docs

unit:
  stage: verify
  timeout: 15m
  needs: ["build"]
  script:
    - npm test

# ---------------------------------------------------------------------------------------------
# Stage 2: the browser stages. Every job here must pass with NO DeepSeek variable set.
# ---------------------------------------------------------------------------------------------

.browser:
  stage: gate
  needs: ["build"]
  before_script:
    - npm ci --no-audit --no-fund
    - npx playwright install --with-deps chromium chromium-headless-shell
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-diagnostics/
    # Redacted diagnostics only. `.investigator/` is deliberately absent.

e2e:
  extends: .browser
  timeout: 20m
  script:
    - npm run test:e2e

reliability-gate:
  extends: .browser
  # The 100-run fixture plus nine specs, run TWICE. Generous ceiling: the budget assertions
  # inside the specs are what enforce performance, not this timeout.
  timeout: 60m
  script:
    # Proves the deterministic path needs no AI configuration (decision 6): if any of these
    # were required, this job would fail at config load rather than at a provider call.
    - unset DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_FAST_MODEL DEEPSEEK_REASONING_MODEL DEEPSEEK_FALLBACK_MODEL
    - mkdir -p ci-diagnostics
    - npm run gate:twice 2>&1 | tee ci-diagnostics/reliability-gate.log

demo:
  extends: .browser
  timeout: 20m
  script:
    # The documented M1 demo must actually run, with no AI configuration present.
    - unset DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_FAST_MODEL DEEPSEEK_REASONING_MODEL DEEPSEEK_FALLBACK_MODEL
    - mkdir -p ci-diagnostics
    - node apps/cli/dist/bin.js init --workspace ./demo-ws --json | tee ci-diagnostics/demo-init.json
    - >
      node apps/cli/dist/bin.js run --workspace ./demo-ws
      --fixture-experiment packages/test-fixtures/experiments/product-failing-intermittent.json
      --fixture-app product-failing-intermittent --repeat 8 --json
      | tee ci-diagnostics/demo-run.json
    - node apps/cli/dist/bin.js doctor --workspace ./demo-ws --json | tee ci-diagnostics/demo-doctor.json

# ---------------------------------------------------------------------------------------------
# Windows verification.
#
# Windows is REQUIRED (decision 5) and cannot be satisfied by a Linux runner: the defects this
# project has already hit on Windows -- CRLF rewriting frozen bytes, file locking during browser
# teardown, path separators -- are exactly the ones a Linux-only gate cannot see.
#
# This job is written and maintained, and runs as soon as a runner carrying the tags below is
# registered. `WINDOWS_RUNNER_TAG` is a CI/CD variable so the tag can be set per project without
# editing this file; see docs/operations/windows-runner.md for provisioning.
# ---------------------------------------------------------------------------------------------

windows-gate:
  stage: gate
  needs: ["build"]
  timeout: 90m
  tags:
    - $WINDOWS_RUNNER_TAG
  # Until a Windows runner exists the job would sit pending forever and block the pipeline, so it
  # is opt-in by variable. Set RUN_WINDOWS_GATE=true once a tagged runner is registered.
  rules:
    - if: '$RUN_WINDOWS_GATE == "true"'
      when: always
    - when: never
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .playwright/
  before_script:
    - npm ci --no-audit --no-fund
    - npx playwright install chromium chromium-headless-shell
  script:
    - pwsh -File scripts/verify.ps1 -Gate
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-diagnostics/
