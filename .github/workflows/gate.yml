# ============================================================================================
# NON-AUTHORITATIVE. This workflow is NOT the gate.
#
# Open question Q3 was answered on 2026-09-11: GitLab CI is the authoritative CI provider
# (docs/m0-decisions.md, decision 5). The gate lives in `.gitlab-ci.yml`.
#
# This file is retained only as a reference translation for anyone mirroring the repository to
# GitHub. It has never executed. Nothing in the project's exit criteria reads it, and a green run
# here would not satisfy any milestone gate. Do not add stages here expecting them to be enforced:
# add them to `.gitlab-ci.yml`, which is the file that runs.
#
# If the mirror is ever retired, delete this file rather than leaving two configurations that
# both look like the main gate.
# ============================================================================================

name: reliability-gate (non-authoritative mirror)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      # Path handling, file locking, and process termination differ enough between these that a
      # Windows-only developer machine is not sufficient evidence (reliability strategy, R19).
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    env:
      # The gate proves the execution path never reads the key and never leaks it.
      DEEPSEEK_API_KEY: sk-dummy-DO-NOT-LEAK-4f3a91c7e2b85d06
      DEEPSEEK_BASE_URL: https://api.example.invalid/v1
      DEEPSEEK_FAST_MODEL: fixture-fast
      DEEPSEEK_REASONING_MODEL: fixture-reasoning
      DEEPSEEK_FALLBACK_MODEL: fixture-fallback

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Documentation and schema invariants
        run: npm run test:docs

      - name: Unit and integration tests
        run: npm test

      - name: CLI end-to-end tests
        run: npm run test:e2e

      # The reliability gate runs TWICE for the nine non-performance specs: a test that passes
      # once and fails once fails the gate. Caching is deliberately not used here, since a
      # cached green gate proves nothing about the current tree.
      - name: Reliability gate (twice)
        run: node scripts/run-gate-twice.mjs

      - name: Upload gate artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-diagnostics-${{ matrix.os }}
          path: |
            test-results/
            *.log
          retention-days: 7
          if-no-files-found: ignore
